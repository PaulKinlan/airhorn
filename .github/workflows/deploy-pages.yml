name: Deploy to Cloudflare Pages

# airhorn-9dal (fleet-fpr18): airhorn is a Tier 3 static site — the whole artifact is `npm run build`'s
# dist/ directory (25 files, ~332 KB) and it needs no runtime: no Pages Functions, no bindings, no
# server. This workflow is the ONLY deploy automation in the repo (there was no CI before it); the
# manual equivalent is the one command in the last step, run by hand, if the workflow is unavailable.
#
# It needs two repository secrets, created by the account owner, never by a lane:
#   CLOUDFLARE_API_TOKEN   — a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — the account that owns the `airhorner` Pages project
# With either one absent the job fails in the guard step below, by name, before anything is built or
# deployed — it never half-deploys and never reports success.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require the Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Cloudflare credentials missing::Cannot deploy to Cloudflare Pages:$missing is not set. Add it as a repository secret (Settings → Secrets and variables → Actions). The token needs the 'Cloudflare Pages: Edit' permission; the account id is the account that owns the 'airhorner' Pages project. Nothing was built and nothing was deployed."
            exit 1
          fi
          echo "Cloudflare credentials present (values not printed)."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build dist/
        run: npm run build

      - name: Deploy dist/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy --project-name airhorner --branch "${{ github.ref_name }}"

      # The first run needs the Pages project to exist; creating it is account-owner work, not a lane's:
      #   CLOUDFLARE_API_TOKEN=... CLOUDFLARE_ACCOUNT_ID=... npx wrangler pages project create airhorner --production-branch main
      # The manual equivalent of this whole workflow, from a checkout with the same two variables set:
      #   npm ci && npm run build && npx wrangler pages deploy --project-name airhorner --branch main
