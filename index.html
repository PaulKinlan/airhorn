<!doctype html>
<html lang=en-GB>
  <head>
    <meta charset='utf-8'>
    <!-- Declared before any paint so the browser can theme the canvas,
         scrollbars and form controls from the first frame. -->
    <meta name='color-scheme' content='light dark'>
    <title>The Air Horner</title>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='description' content='An Air horn. Probably the best air horn web app there is.'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name='text-scale' content='scale'>
    <link rel='canonical' href='https://airhorner.com/'>
    <link rel='manifest' href='/manifest.json'>
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>
    <meta name='application-name' content='Air Horner'>
    <meta name='apple-mobile-web-app-status-bar-style' content='black'>
    <meta name='apple-mobile-web-app-title' content='Air Horner'>
    <link rel='icon' sizes='192x192' href='/images/touch/android-launchericon-192-192.png'>
    <link rel='apple-touch-icon'  href='/images/touch/android-launchericon-192-192.png'>
    <meta name='msapplication-TileImage' content='/images/touch/android-launchericon-144-144.png'>
    <meta name='msapplication-TileColor' content='#2196F3'>
    <meta name='theme-color' content='#2196F3' media='(prefers-color-scheme: light)'>
    <meta name='theme-color' content='#07131F' media='(prefers-color-scheme: dark)'>
    <meta property='og:title' content='Air Horn'>
    <meta property='og:type' content='website'>
    <meta property='og:image' content='https://airhorner.com/images/touch/android-launchericon-192-192.png'>
    <meta property='og:url' content='https://airhorner.com/'>
    <meta property='og:description' content='The best and easiest Air Horn web app there is. No install just use it right away in your browser!'>
    <meta name='twitter:card' content='summary'>
    <meta name='twitter:url' content='https://airhorner.com/'>
    <meta name='twitter:title' content='Air Horn'>
    <meta name='twitter:description' content='The best and easiest Air Horn web app there is. No install just use it right away in your browser!'>
    <meta name='twitter:image' content='https://airhorner.com/images/touch/android-launchericon-192-192.png'>
    <meta name='twitter:creator' content='@paul_kinlan'>
    <!-- Critical fallback (airhorn-zb0), extended for the async stylesheet
         (airhorn-c5e), geometry fixed per review finding airhorn-e18:
         main.css loads non-render-blocking (media=print, swapped to all on
         load) so first paint waits only for the HTML. That makes this inline
         block the stylesheet for the first paint on every load, so it paints
         the DESIGNED horn: tokens, centering, colours, and .inner as the sole
         in-flow grid child of .horn (concentric 80% disc). The label is
         absolutely positioned below the horn and hidden while the sheet is
         in flight or loaded; if the sheet genuinely fails, its onerror adds
         .stylesheet-failed and the label is revealed (airhorn-zb0's
         labelled-unstyled contract; a no-JS browser cannot report a failed
         sheet, there the aria-label still names the button). #installer is
         out of flow so the pre-swap frame cannot reflow when the sheet
         lands. Values here MUST stay identical to main.css's (the a11y and
         resilience suites pin computed styles on both paths); the layer is
         declared before main.css's own, so every main.css rule beats these
         once it swaps in (unlayered styles would win the cascade forever -
         they would have pinned the installer hidden). -->
    <style>
      @layer critical {
        :root {
          --page-bg: #2196f3;
          --horn-bg: #f44336;
          --horn-inner-bg: #b71c1c;
          --horn-center-bg: #000;

          @media (prefers-color-scheme: dark) {
            --page-bg: #07131f;
            --horn-bg: #d32f2f;
            --horn-inner-bg: #7f0000;
            --horn-center-bg: #050505;
          }

          @supports (color: light-dark(#000, #fff)) {
            --page-bg: light-dark(#2196f3, #07131f);
            --horn-bg: light-dark(#f44336, #d32f2f);
            --horn-inner-bg: light-dark(#b71c1c, #7f0000);
            --horn-center-bg: light-dark(#000, #050505);
          }

          /* Modern system typography stack & scale tokens (airhorn-fonts):
             values match main.css exactly so pre-swap first paint shares the
             same metrics and hierarchy as the full stylesheet. */
          --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
          --font-size-display: 2rem;
          --font-size-heading: 1.25rem;
          --font-size-body: 1rem;
          --font-size-button: 0.9375rem;
          --font-size-caption: 0.875rem;
          --line-height-tight: 1.2;
          --line-height-snug: 1.35;
          --line-height-normal: 1.5;
          --font-weight-regular: 400;
          --font-weight-medium: 500;
          --font-weight-semibold: 600;
          --font-weight-bold: 700;
        }

        html,
        body {
          block-size: 100%;
        }

        body {
          margin: 0;
          background-color: var(--page-bg);
          font-family: var(--font-sans);
          font-size: var(--font-size-body);
          font-weight: var(--font-weight-regular);
          line-height: var(--line-height-normal);
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
        }

        h1 {
          font-size: var(--font-size-display);
          font-weight: var(--font-weight-bold);
          line-height: var(--line-height-tight);
        }

        #container {
          block-size: 100%;
          display: grid;
          place-items: center;
        }

        #airhorn {
          /* Same box as main.css's #airhorn (airhorn-fgvq). Left as `auto`, this
             shrink-wrapped the horn (219px wide at 780x437) until the async
             sheet landed and made it inline-size:100% (780px) - the single
             layout shift measured on this page, 0.3599, on 5 of 6 loads, and
             attributed to div#airhorn itself because the box the grid centres
             INSIDE is what resized. The horn's own size never changes; only
             the box around it did. */
          inline-size: 100%;
          block-size: 100%;
          min-inline-size: 0;
          min-block-size: 0;
          display: grid;
          place-items: center;
        }

        .horn {
          inline-size: min(50vmin, 26rem);
          aspect-ratio: 1;
          appearance: none;
          border: 0;
          margin: 0;
          padding: 0;
          font: inherit;
          color: inherit;
          border-radius: 50%;
          display: grid;
          place-items: center;
          /* Anchor for the absolutely-positioned label below (airhorn-e18:
             the label must never become a second grid row - that squashed
             .inner into an ellipse at first paint). */
          position: relative;
          background-color: var(--horn-bg);
        }

        .horn-label {
          font-family: var(--font-sans);
          font-size: var(--font-size-heading);
          font-weight: var(--font-weight-semibold);
          line-height: var(--line-height-snug);
          /* Hidden during the async window: the designed horn speaks for
             itself (the aria-label carries the name). Revealed only when
             the sheet genuinely fails, via .stylesheet-failed set by the
             link's onerror below. Absolutely positioned so, when revealed,
             it sits under the horn instead of becoming a second grid row. */
          display: none;
          position: absolute;
          top: 100%;
          left: 0;
          right: 0;
          text-align: center;
        }

        .stylesheet-failed .horn-label {
          display: block;
        }

        .inner {
          inline-size: 80%;
          block-size: 80%;
          border-radius: 50%;
          display: grid;
          place-items: center;
          background-color: var(--horn-inner-bg);
        }

        .center {
          inline-size: 12.5%;
          block-size: 12.5%;
          border-radius: 50%;
          background-color: var(--horn-center-bg);
          opacity: 0.9;
        }

        .visually-hidden {
          position: absolute;
          inline-size: 1px;
          block-size: 1px;
          margin: -1px;
          padding: 0;
          border: 0;
          overflow: clip;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        #installer:not(.available) {
          /* Out of flow (airhorn-e18): in-flow, the hidden installer added
             21px of scrollHeight that collapsed the moment main.css fixed
             its position - a reflow on every first load. */
          position: absolute;
          top: 0;
          inset-inline-end: 0;
          visibility: hidden;
          pointer-events: none;
        }

        #installer .button {
          font-family: var(--font-sans);
          font-size: var(--font-size-button);
          font-weight: var(--font-weight-medium);
          line-height: var(--line-height-tight);
        }

        .boot-alert {
          font-family: var(--font-sans);
          font-size: var(--font-size-body);
          line-height: var(--line-height-normal);
        }

        #app-status {
          font-family: var(--font-sans);
          font-size: var(--font-size-caption);
          line-height: var(--line-height-snug);
        }

        /* The recovery control's focus ring (airhorn-bjk1): the boot watchdog
           reveals the banner and focuses this button ITSELF, so its indicator
           must not depend on main.css still being in flight. main.css is
           fetched non-render-blocking, and on the kind of connection that
           fails a bundle the sheet can land after the banner does - until it
           does, a programmatic focus painted only the UA's 1px ring, below the
           2px an indicator needs. currentColor is why one value serves both
           paths: unstyled the button inherits the UA's black text on a white
           page, and once main.css lands it is near-white on the dark card.
           Values MUST stay identical to main.css's .alert-button rule (the
           a11y and resilience suites pin computed styles on both paths). */
        .alert-button {
          font-family: var(--font-sans);
          font-size: var(--font-size-button);
          font-weight: var(--font-weight-medium);
          line-height: var(--line-height-tight);
        }

        .alert-button:is(:focus, :focus-visible) {
          outline: 3px solid currentColor;
          outline-offset: 3px;
        }
      }
    </style>
    <!-- Async stylesheet: fetched at low priority, swapped to screen media
         by /async-css.js. The handlers used to be inline attributes on this
         link; under script-src 'self' those are blocked silently, which left
         media at 'print' forever (airhorn-xnd1). The loader is DEFERRED: the
         fetch starts during parse but it runs after it, so it adds no round
         trip in front of first paint (a parser-blocking tag here would). The
         load/error race the inline attribute never had is closed inside the
         loader instead - it checks link.sheet for a load that already
         happened, and window load for a sheet that never arrived. No JS
         (noscript) keeps the classic blocking link, since without JS this
         inline critical block is all there is either way. -->
    <link id='main-css' rel='stylesheet' href='/styles/main.css' media='print'>
    <script src='/async-css.js' defer></script>
    <noscript><link rel='stylesheet' href='/styles/main.css'></noscript>
    <link rel='preload' href='/sounds/airhorn.mp3' as='fetch' crossorigin fetchpriority='low'>
  </head>
  <body>
    <main id='container'>
      <h1 class='visually-hidden'>The Air Horner</h1>
      <div id='airhorn'>
        <button type='button' class='horn' aria-label='Air horn' aria-pressed='false' aria-describedby='horn-help'>
          <span class='inner' aria-hidden='true'>
            <span class='center'></span>
          </span>
          <span class='horn-label'>Air horn</span>
        </button>
        <p id='horn-help' class='visually-hidden'>Press and hold to sound the air horn. Release to stop.</p>
      </div>
    </main>
    <div id='installer'>
      <!-- disabled at parse (airhorn-fld): the attribute is structural, so
           even with CSS blocked the exposed button reads as inert instead of
           silently doing nothing; beforeinstallprompt enables it. -->
      <button type='button' class='button' disabled>Install</button>
    </div>
    <!-- One polite live region for status while the app runs: offline and
         back-online, a service worker update. Filled by the announcer
         (window.__airhornAnnounce, defined in /boot-watchdog.js) from both
         main.js and the SW registration, so both surfaces share one voice. Empty it is
         rendered but visually hidden, so nothing shows or is announced in
         the normal case. -->
    <div id='app-status' role='status'></div>
    <!-- Revealed by the boot watchdog below when the module bundle never runs
         (blocked by a filter or proxy, or a corrupt body from the cache): the
         static HTML paints a complete horn either way, so without this the
         page looks alive but is inert and says nothing. -->
    <div id='boot-failure' class='boot-alert' role='alert' hidden>
      <p>The Air Horner couldn&rsquo;t start, so the horn is silent. Check your connection, then try again.</p>
      <button type='button' id='boot-retry' class='alert-button'>Try again</button>
    </div>
    <noscript>
      <div class='boot-alert' role='alert'>
        <p>The Air Horner needs JavaScript to make a sound. Enable JavaScript and reload the page.</p>
      </div>
    </noscript>
    <script type='module' src='/src/main.js'></script>
    <!-- Boot watchdog: external so the policy can stay script-src
         'self' (airhorn-xnd1). Classic and non-async on purpose - it runs
         during body parse, before the deferred module executes, which is
         the ordering its module-error listener depends on. Do not make it
         a module and do not defer it. -->
    <script src='/boot-watchdog.js'></script>
    <!-- Service worker registration, update notices and the one polite
         announcer (window.__airhornAnnounce): external so the policy can
         stay script-src 'self' (airhorn-xnd1). Same position and same
         classic, non-async ordering as the inline block it replaces. -->
    <script src='/sw-register.js'></script>
  </body>
</html>
