<!doctype html>
<html lang=en-GB>
  <head>
    <meta charset='utf-8'>
    <!-- Declared before any paint so the browser can theme the canvas,
         scrollbars and form controls from the first frame. -->
    <meta name='color-scheme' content='light dark'>
    <title>The Air Horner</title>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='description' content='An Air horn. Probably the best air horn web app there is.'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='canonical' href='https://airhorner.com/'>
    <link rel='manifest' href='/manifest.json'>
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>
    <meta name='application-name' content='Air Horner'>
    <meta name='apple-mobile-web-app-status-bar-style' content='black'>
    <meta name='apple-mobile-web-app-title' content='Air Horner'>
    <link rel='icon' sizes='192x192' href='/images/touch/android-launchericon-192-192.png'>
    <link rel='apple-touch-icon'  href='/images/touch/android-launchericon-192-192.png'>
    <meta name='msapplication-TileImage' content='/images/touch/android-launchericon-144-144.png'>
    <meta name='msapplication-TileColor' content='#2196F3'>
    <meta name='theme-color' content='#2196F3' media='(prefers-color-scheme: light)'>
    <meta name='theme-color' content='#07131F' media='(prefers-color-scheme: dark)'>
    <meta property='og:title' content='Air Horn'>
    <meta property='og:type' content='website'>
    <meta property='og:image' content='https://airhorner.com/images/touch/android-launchericon-192-192.png'>
    <meta property='og:url' content='https://airhorner.com/'>
    <meta property='og:description' content='The best and easiest Air Horn web app there is. No install just use it right away in your browser!'>
    <meta name='twitter:card' content='summary'>
    <meta name='twitter:url' content='https://airhorner.com/'>
    <meta name='twitter:title' content='Air Horn'>
    <meta name='twitter:description' content='The best and easiest Air Horn web app there is. No install just use it right away in your browser!'>
    <meta name='twitter:image' content='https://airhorner.com/images/touch/android-launchericon-192-192.png'>
    <meta name='twitter:creator' content='@paul_kinlan'>
    <!-- Critical fallback (airhorn-zb0), extended for the async stylesheet
         (airhorn-c5e), geometry fixed per review finding airhorn-e18:
         main.css loads non-render-blocking (media=print, swapped to all on
         load) so first paint waits only for the HTML. That makes this inline
         block the stylesheet for the first paint on every load, so it paints
         the DESIGNED horn: tokens, centering, colours, and .inner as the sole
         in-flow grid child of .horn (concentric 80% disc). The label is
         absolutely positioned below the horn and hidden while the sheet is
         in flight or loaded; if the sheet genuinely fails, its onerror adds
         .stylesheet-failed and the label is revealed (airhorn-zb0's
         labelled-unstyled contract; a no-JS browser cannot report a failed
         sheet, there the aria-label still names the button). #installer is
         out of flow so the pre-swap frame cannot reflow when the sheet
         lands. Values here MUST stay identical to main.css's (the a11y and
         resilience suites pin computed styles on both paths); the layer is
         declared before main.css's own, so every main.css rule beats these
         once it swaps in (unlayered styles would win the cascade forever -
         they would have pinned the installer hidden). -->
    <style>
      @layer critical {
        :root {
          --page-bg: #2196f3;
          --horn-bg: #f44336;
          --horn-inner-bg: #b71c1c;
          --horn-center-bg: #000;

          @media (prefers-color-scheme: dark) {
            --page-bg: #07131f;
            --horn-bg: #d32f2f;
            --horn-inner-bg: #7f0000;
            --horn-center-bg: #050505;
          }

          @supports (color: light-dark(#000, #fff)) {
            --page-bg: light-dark(#2196f3, #07131f);
            --horn-bg: light-dark(#f44336, #d32f2f);
            --horn-inner-bg: light-dark(#b71c1c, #7f0000);
            --horn-center-bg: light-dark(#000, #050505);
          }
        }

        html,
        body {
          block-size: 100%;
        }

        body {
          margin: 0;
          background-color: var(--page-bg);
        }

        #container {
          block-size: 100%;
          display: grid;
          place-items: center;
        }

        #airhorn {
          /* Same box as main.css's #airhorn (airhorn-fgvq). Left as `auto`, this
             shrink-wrapped the horn (219px wide at 780x437) until the async
             sheet landed and made it inline-size:100% (780px) - the single
             layout shift measured on this page, 0.3599, on 5 of 6 loads, and
             attributed to div#airhorn itself because the box the grid centres
             INSIDE is what resized. The horn's own size never changes; only
             the box around it did. */
          inline-size: 100%;
          block-size: 100%;
          min-inline-size: 0;
          min-block-size: 0;
          display: grid;
          place-items: center;
        }

        .horn {
          inline-size: min(50vmin, 26rem);
          aspect-ratio: 1;
          appearance: none;
          border: 0;
          margin: 0;
          padding: 0;
          border-radius: 50%;
          display: grid;
          place-items: center;
          /* Anchor for the absolutely-positioned label below (airhorn-e18:
             the label must never become a second grid row - that squashed
             .inner into an ellipse at first paint). */
          position: relative;
          background-color: var(--horn-bg);
        }

        .horn-label {
          font: inherit;
          /* Hidden during the async window: the designed horn speaks for
             itself (the aria-label carries the name). Revealed only when
             the sheet genuinely fails, via .stylesheet-failed set by the
             link's onerror below. Absolutely positioned so, when revealed,
             it sits under the horn instead of becoming a second grid row. */
          display: none;
          position: absolute;
          top: 100%;
          left: 0;
          right: 0;
          text-align: center;
        }

        .stylesheet-failed .horn-label {
          display: block;
        }

        .inner {
          inline-size: 80%;
          block-size: 80%;
          border-radius: 50%;
          display: grid;
          place-items: center;
          background-color: var(--horn-inner-bg);
        }

        .center {
          inline-size: 12.5%;
          block-size: 12.5%;
          border-radius: 50%;
          background-color: var(--horn-center-bg);
          opacity: 0.9;
        }

        .visually-hidden {
          position: absolute;
          inline-size: 1px;
          block-size: 1px;
          margin: -1px;
          padding: 0;
          border: 0;
          overflow: clip;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        #installer:not(.available) {
          /* Out of flow (airhorn-e18): in-flow, the hidden installer added
             21px of scrollHeight that collapsed the moment main.css fixed
             its position - a reflow on every first load. */
          position: absolute;
          top: 0;
          inset-inline-end: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }
    </style>
    <!-- Async stylesheet: fetched at low priority, swapped to screen media
         on load. No JS (noscript) keeps the classic blocking link, since
         without JS this inline critical block is all there is either way. -->
    <link rel='stylesheet' href='/styles/main.css' media='print' onload="this.media='all'" onerror="document.documentElement.classList.add('stylesheet-failed')">
    <noscript><link rel='stylesheet' href='/styles/main.css'></noscript>
    <link rel='preload' href='/sounds/airhorn.mp3' as='fetch' crossorigin>
  </head>
  <body>
    <main id='container'>
      <h1 class='visually-hidden'>The Air Horner</h1>
      <div id='airhorn'>
        <button type='button' class='horn' aria-label='Air horn' aria-pressed='false' aria-describedby='horn-help'>
          <span class='inner' aria-hidden='true'>
            <span class='center'></span>
          </span>
          <span class='horn-label'>Air horn</span>
        </button>
        <p id='horn-help' class='visually-hidden'>Press and hold to sound the air horn. Release to stop.</p>
      </div>
    </main>
    <div id='installer'>
      <!-- disabled at parse (airhorn-fld): the attribute is structural, so
           even with CSS blocked the exposed button reads as inert instead of
           silently doing nothing; beforeinstallprompt enables it. -->
      <button type='button' class='button' disabled>Install</button>
    </div>
    <!-- One polite live region for status while the app runs: offline and
         back-online, a service worker update. Filled by the announcer in the
         inline script below (window.__airhornAnnounce) from both main.js and
         the SW registration, so both surfaces share one voice. Empty it is
         rendered but visually hidden, so nothing shows or is announced in
         the normal case. -->
    <div id='app-status' role='status'></div>
    <!-- Revealed by the boot watchdog below when the module bundle never runs
         (blocked by a filter or proxy, or a corrupt body from the cache): the
         static HTML paints a complete horn either way, so without this the
         page looks alive but is inert and says nothing. -->
    <div id='boot-failure' class='boot-alert' role='alert' hidden>
      <p>The Air Horner couldn&rsquo;t start, so the horn is silent. Check your connection, then try again.</p>
      <button type='button' id='boot-retry' class='alert-button'>Try again</button>
    </div>
    <noscript>
      <div class='boot-alert' role='alert'>
        <p>The Air Horner needs JavaScript to make a sound. Enable JavaScript and reload the page.</p>
      </div>
    </noscript>
    <script type='module' src='/src/main.js'></script>
    <script>
      // Boot watchdog. The static HTML paints a complete horn, so when the
      // module bundle never executes - or executes and then fails during
      // setup - the page looks alive but is inert and silent. This notices,
      // and says so. src/main.js calls window.__airhornBooted() only once the
      // app is actually usable, so 'booted' means the horn works.
      (function () {
        var booted = false;
        var banner = document.getElementById('boot-failure');
        var retry = document.getElementById('boot-retry');

        function show() {
          if (booted || !banner || !banner.hidden) return;
          banner.hidden = false;
          if (retry) retry.focus();
        }

        // Booting cancels every pending watchdog timer, so a healthy page is
        // left with none: a permanently pending timer would keep the page
        // from ever reading as quiescent (a11y and sw-offline suites wait
        // for observed quiescence).
        var backstop = 0;
        window.__airhornBooted = function () {
          booted = true;
          clearTimeout(backstop);
          // A late bundle retires the notice: the page was wrong to claim the
          // horn was dead, so take it back (airhorn-duj). The banner took focus
          // when it appeared, so it has to hand focus on when it goes - a bare
          // retry.blur() dropped focus to <body> and left a keyboard user who
          // was waiting on "Try again" with no focus position at all, their
          // next Tab restarting from the top of the document (airhorn-bjk1).
          // Same rule the installer's focus restoration already follows: hand
          // it to the control that now works, and only if the banner still had
          // it (never steal focus the user has already moved).
          if (banner && !banner.hidden) {
            banner.hidden = true;
            if (retry) {
              var horn = document.querySelector('.horn');
              if (document.activeElement === retry && horn) horn.focus();
              else retry.blur();
            }
          }
        };

        // Fast path: the module element fires `error` when its fetch fails
        // (blocked) or its source fails to compile (corrupt cache body).
        var moduleScript = document.querySelector('script[type=module]');
        if (moduleScript) moduleScript.addEventListener('error', show);

        // Slow path, for a hung fetch that fires neither `error` nor `load`:
        // arm on load - the module always boots before load when it runs -
        // with a short grace, plus a hard backstop measured from parse. The
        // backstop is effectively ~14s: the timer calls arm() at 12s and arm
        // schedules the reveal 2s later.
        var armed = false;
        function arm() {
          if (armed || booted) return;
          armed = true;
          setTimeout(show, 2000);
        }
        window.addEventListener('load', arm);
        backstop = setTimeout(arm, 12000);

        if (retry) retry.addEventListener('click', function () { window.location.reload(); });

        // The one polite voice (see #app-status above). Intentionally no
        // timers: a message stays until the next one replaces it, so a
        // healthy page schedules nothing and reads as quiescent.
        var statusRegion = document.getElementById('app-status');
        window.__airhornAnnounce = function (message) {
          if (statusRegion) statusRegion.textContent = message;
        };
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(reg => {
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (newWorker) {
              // At updatefound the worker is already 'installing', so that
              // state never reaches the statechange listener below (airhorn-
              // d5q): announce the update now, not from a branch that cannot
              // run.
              if (navigator.serviceWorker.controller) {
                window.__airhornAnnounce?.('Updating the Air Horner to a new version...');
              }
              // 'redundant' means this worker was replaced or dropped; only a
              // worker that never reached 'installed' is a lost upgrade. A
              // replaced worker - like the current controller superseded by
              // the next update - fires 'redundant' on every SUCCESSFUL
              // update, and announcing failure there lied on the happy path
              // (airhorn-swq).
              let reachedInstalled = false;
              newWorker.addEventListener('statechange', () => {
                // Update notices (airhorn-8nz): only when an update arrives
                // over an existing controller - a first install is silent.
                // The message is transient by design: with a controller the
                // page reloads itself via controllerchange right after;
                // mechanics (skipWaiting + reload) are unchanged.
                if (newWorker.state === 'installed') {
                  // Record the transition for every worker: a first-install
                  // worker reaches 'installed' without a controller, and it
                  // is exactly that worker whose later 'redundant' must stay
                  // silent (airhorn-swq). Only the ANNOUNCE is gated on an
                  // update context.
                  reachedInstalled = true;
                  if (navigator.serviceWorker.controller) {
                    window.__airhornAnnounce?.('A new version is ready - reloading...');
                    // This tab has now said why it is about to reload; the
                    // controllerchange handler below must not say it a
                    // second time (airhorn-56j).
                    announcedReady = true;
                    newWorker.postMessage('skipWaiting');
                  }
                } else if (newWorker.state === 'redundant' && !reachedInstalled && navigator.serviceWorker.controller) {
                  // The upgrade was dropped - a denied cache write during precache is the
                  // common cause. Say so: silently staying on the previous build is the
                  // failure the user cannot see (airhorn-nv9). Through the one polite
                  // voice (airhorn-8nz), not a second channel.
                  window.__airhornAnnounce?.('The app could not update - you are still on the previous version.');
                }
              });
            }
          });
        });

        const hadController = !!navigator.serviceWorker.controller;
        let announcedReady = false;
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (hadController && !refreshing) {
            refreshing = true;
            // A tab that opened mid-install never saw updatefound, so nothing
            // has told it why the page is about to reload on its own
            // (airhorn-56j). The tab that reloads says why - and only once:
            // a tab that announced the ready line above stays silent here.
            if (!announcedReady) {
              window.__airhornAnnounce?.('A new version is ready - reloading...');
            }
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
