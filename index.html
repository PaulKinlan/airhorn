<!doctype html>
<html lang=en-GB>
  <head>
    <meta charset='utf-8'>
    <!-- Declared before any paint so the browser can theme the canvas,
         scrollbars and form controls from the first frame. -->
    <meta name='color-scheme' content='light dark'>
    <title>The Air Horner</title>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='description' content='An Air horn. Probably the best air horn web app there is.'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='canonical' href='https://airhorner.com/'>
    <link rel='manifest' href='/manifest.json'>
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>
    <meta name='application-name' content='Air Horner'>
    <meta name='apple-mobile-web-app-status-bar-style' content='black'>
    <meta name='apple-mobile-web-app-title' content='Air Horner'>
    <link rel='icon' sizes='192x192' href='/images/touch/android-launchericon-192-192.png'>
    <link rel='apple-touch-icon'  href='/images/touch/android-launchericon-192-192.png'>
    <meta name='msapplication-TileImage' content='/images/touch/android-launchericon-144-144.png'>
    <meta name='msapplication-TileColor' content='#2196F3'>
    <meta name='theme-color' content='#2196F3' media='(prefers-color-scheme: light)'>
    <meta name='theme-color' content='#07131F' media='(prefers-color-scheme: dark)'>
    <meta property='og:title' content='Air Horn'>
    <meta property='og:type' content='website'>
    <meta property='og:image' content='https://airhorner.com/images/touch/android-launchericon-192-192.png'>
    <meta property='og:url' content='https://airhorner.com/'>
    <meta property='og:description' content='The best and easiest Air Horn web app there is. No install just use it right away in your browser!'>
    <meta name='twitter:card' content='summary'>
    <meta name='twitter:url' content='https://airhorner.com/'>
    <meta name='twitter:title' content='Air Horn'>
    <meta name='twitter:description' content='The best and easiest Air Horn web app there is. No install just use it right away in your browser!'>
    <meta name='twitter:image' content='https://airhorner.com/images/touch/android-launchericon-192-192.png'>
    <meta name='twitter:creator' content='@paul_kinlan'>
    <link rel='stylesheet' href='/styles/main.css'>
    <link rel='preload' href='/sounds/airhorn.mp3' as='fetch' crossorigin>
  </head>
  <body>
    <main id='container'>
      <h1 class='visually-hidden'>The Air Horner</h1>
      <div id='airhorn'>
        <button type='button' class='horn' aria-label='Air horn' aria-pressed='false' aria-describedby='horn-help'>
          <span class='inner' aria-hidden='true'>
            <span class='center'></span>
          </span>
        </button>
        <p id='horn-help' class='visually-hidden'>Press and hold to sound the air horn. Release to stop.</p>
      </div>
    </main>
    <p id='app-status' class='status' role='status'></p>
    <div id='installer'>
      <button type='button' class='button'>Install</button>
    </div>
    <!-- One polite live region for status while the app runs: offline and
         back-online, a service worker update. Filled by the announcer in the
         inline script below (window.__airhornAnnounce) from both main.js and
         the SW registration, so both surfaces share one voice. Empty it is
         rendered but visually hidden, so nothing shows or is announced in
         the normal case. -->
    <div id='app-status' role='status'></div>
    <!-- Revealed by the boot watchdog below when the module bundle never runs
         (blocked by a filter or proxy, or a corrupt body from the cache): the
         static HTML paints a complete horn either way, so without this the
         page looks alive but is inert and says nothing. -->
    <div id='boot-failure' class='boot-alert' role='alert' hidden>
      <p>The Air Horner couldn&rsquo;t start, so the horn is silent. Check your connection, then try again.</p>
      <button type='button' id='boot-retry' class='alert-button'>Try again</button>
    </div>
    <noscript>
      <div class='boot-alert' role='alert'>
        <p>The Air Horner needs JavaScript to make a sound. Enable JavaScript and reload the page.</p>
      </div>
    </noscript>
    <script type='module' src='/src/main.js'></script>
    <script>
      // Boot watchdog. The static HTML paints a complete horn, so when the
      // module bundle never executes the page looks alive but is inert and
      // silent. This notices, and says so. src/main.js calls
      // window.__airhornBooted() as its first statement, so 'booted' means
      // the app's code actually ran.
      (function () {
        var booted = false;
        var banner = document.getElementById('boot-failure');
        var retry = document.getElementById('boot-retry');

        function show() {
          if (booted || !banner || !banner.hidden) return;
          banner.hidden = false;
          if (retry) retry.focus();
        }

        // Booting cancels every pending watchdog timer, so a healthy page is
        // left with none: a permanently pending timer would keep the page
        // from ever reading as quiescent (a11y and sw-offline suites wait
        // for observed quiescence).
        var backstop = 0;
        window.__airhornBooted = function () {
          booted = true;
          clearTimeout(backstop);
        };

        // Fast path: the module element fires `error` when its fetch fails
        // (blocked) or its source fails to compile (corrupt cache body).
        var moduleScript = document.querySelector('script[type=module]');
        if (moduleScript) moduleScript.addEventListener('error', show);

        // Slow path, for a hung fetch that fires neither `error` nor `load`:
        // arm on load - the module always boots before load when it runs -
        // with a short grace, plus a hard backstop measured from parse.
        var armed = false;
        function arm() {
          if (armed || booted) return;
          armed = true;
          setTimeout(show, 2000);
        }
        window.addEventListener('load', arm);
        backstop = setTimeout(arm, 12000);

        if (retry) retry.addEventListener('click', function () { window.location.reload(); });

        // The one polite voice (see #app-status above). Intentionally no
        // timers: a message stays until the next one replaces it, so a
        // healthy page schedules nothing and reads as quiescent.
        var statusRegion = document.getElementById('app-status');
        window.__airhornAnnounce = function (message) {
          if (statusRegion) statusRegion.textContent = message;
        };
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(reg => {
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                // Update notices (airhorn-8nz): only when an update arrives
                // over an existing controller - a first install is silent.
                // The message is transient by design: with a controller the
                // page reloads itself via controllerchange right after;
                // mechanics (skipWaiting + reload) are unchanged.
                if (newWorker.state === 'installing' && navigator.serviceWorker.controller) {
                  window.__airhornAnnounce?.('Updating the Air Horner to a new version...');
                } else if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  window.__airhornAnnounce?.('A new version is ready - reloading...');
                  newWorker.postMessage('skipWaiting');
                } else if (newWorker.state === 'redundant' && navigator.serviceWorker.controller) {
                  // The upgrade was dropped - a denied cache write during precache is the
                  // common cause. Say so: silently staying on the previous build is the
                  // failure the user cannot see (airhorn-nv9).
                  const status = document.getElementById('app-status');
                  if (status) {
                    status.textContent = 'The app could not update - you are still on the previous version.';
                  }
                }
              });
            }
          });
        });

        const hadController = !!navigator.serviceWorker.controller;
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (hadController && !refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
