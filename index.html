<!doctype html>
<html lang=en-GB>
  <head>
    <meta charset='utf-8'>
    <!-- Declared before any paint so the browser can theme the canvas,
         scrollbars and form controls from the first frame. -->
    <meta name='color-scheme' content='light dark'>
    <title>The Air Horner</title>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='description' content='An Air horn. Probably the best air horn web app there is.'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='canonical' href='https://airhorner.com/'>
    <link rel='manifest' href='/manifest.json'>
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>
    <meta name='application-name' content='Air Horner'>
    <meta name='apple-mobile-web-app-status-bar-style' content='black'>
    <meta name='apple-mobile-web-app-title' content='Air Horner'>
    <link rel='icon' sizes='192x192' href='/images/touch/android-launchericon-192-192.png'>
    <link rel='apple-touch-icon'  href='/images/touch/android-launchericon-192-192.png'>
    <meta name='msapplication-TileImage' content='/images/touch/android-launchericon-144-144.png'>
    <meta name='msapplication-TileColor' content='#2196F3'>
    <meta name='theme-color' content='#2196F3' media='(prefers-color-scheme: light)'>
    <meta name='theme-color' content='#07131F' media='(prefers-color-scheme: dark)'>
    <meta property='og:title' content='Air Horn'>
    <meta property='og:type' content='website'>
    <meta property='og:image' content='https://airhorner.com/images/touch/android-launchericon-192-192.png'>
    <meta property='og:url' content='https://airhorner.com/'>
    <meta property='og:description' content='The best and easiest Air Horn web app there is. No install just use it right away in your browser!'>
    <meta name='twitter:card' content='summary'>
    <meta name='twitter:url' content='https://airhorner.com/'>
    <meta name='twitter:title' content='Air Horn'>
    <meta name='twitter:description' content='The best and easiest Air Horn web app there is. No install just use it right away in your browser!'>
    <meta name='twitter:image' content='https://airhorner.com/images/touch/android-launchericon-192-192.png'>
    <meta name='twitter:creator' content='@paul_kinlan'>
    <link rel='stylesheet' href='/styles/main.css'>
  </head>
  <body>
    <main id='container'>
      <div id='airhorn'>
        <button type='button' class='horn' aria-label='Air horn' aria-pressed='false'>
          <span class='inner' aria-hidden='true'>
            <span class='center'></span>
          </span>
        </button>
      </div>
    </main>
    <div id='installer'>
      <button type='button' class='button'>Install</button>
    </div>
    <script type='module' src='/src/main.js'></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(reg => {
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  newWorker.postMessage('skipWaiting');
                }
              });
            }
          });
        });

        const hadController = !!navigator.serviceWorker.controller;
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (hadController && !refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
