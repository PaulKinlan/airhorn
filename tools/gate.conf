# tools/gate.conf — the runner tools/fast-gate.sh uses per selected suite, and its ONLY source
# (airhorn-v6th): an exported FAST_GATE_RUNNER that differs from FAST_GATE_RUNNER below exits 1
# rather than being honoured, so this file - a reviewed, committed diff - is how the runner changes.
# node:test ships with Node >= 18: zero added devDependencies, headless, ~0.1 s
# for the whole suite. If a heavier tier is ever added, name its runner here.
# The TAP reporter is pinned so per-case results are machine-readable and stable
# across Node's default (spec) reporter's cosmetic changes (airhorn-n00).
FAST_GATE_RUNNER="node --test --test-reporter=tap"
# Suites are run ONE AT A TIME: the browser suites (a11y, sw-offline) each spawn a
# headless Chrome, and the fleet rule is one headless browser at a time per VM.
FAST_GATE_JOBS=1

# Per-suite tier declarations (airhorn-z4cn). The tier is a DECLARED fact, reviewable in
# this diff - never inferred from a file extension (an extension cannot decide: tests/*.test.mjs
# is MIXED - 6 real node:test suites and 12 narrate-and-exit assert-scripts share it) and never
# sniffed from file content at runtime (a regex that picks the runner can be wrong silently,
# deciding what runs). One `path=tier` line per suite. When this block is present, a selected
# suite with NO declaration fails the gate rather than falling back to a guess. When the block
# is absent entirely (the gate-smoke probes copy tools/ and write their own confs), the legacy
# extension mapping applies - the absence of the block is itself a fact in the conf's diff.
# Declared as-run today: the .test.js suites are node-test, ALL .test.mjs run script-tier today
# (the 6 real node:test .mjs suites move to node-test in a separate reviewed commit).
SUITE_TIERS="
tests/a11y.test.mjs=script
tests/audio-parity-verdict.test.js=node-test
tests/derive-coverage-contract.test.js=node-test
tests/docs-recipe.test.mjs=node-test
tests/gate-map.test.js=node-test
tests/gate-smoke.test.js=node-test
tests/health.test.mjs=node-test
tests/horn.test.js=node-test
tests/keyboard.test.mjs=script
tests/modules.test.js=node-test
tests/multitab.test.mjs=script
tests/nav-guard.test.mjs=node-test
tests/press-guard.test.mjs=node-test
tests/reflow-zoom.test.mjs=script
tests/resilience-ui.test.mjs=script
tests/screenreader.test.mjs=script
tests/shortcuts.test.mjs=script
tests/sw-failover.test.mjs=script
tests/sw-offline.test.mjs=script
tests/test-support.test.js=node-test
tests/tool-bound-kill.test.mjs=node-test
tests/visual-overrides.test.mjs=script
tests/webmcp-browser.test.mjs=script
