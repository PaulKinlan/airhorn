# tools/check.conf — installed as ~/.fleet/check.conf on this project's VM by the coord
# (bash ~/fleet/bin/fleet-install-check-conf, or bin/fleet's stamped install) AFTER this lands.
#
# `bin/fleet-check` sources this file. Both commands are RELATIVE and run with the working directory
# set to the checkout root.
#
# R3 of ~/fleet/docs/speed.md: both gates exist for every repo, even when the full gate is under budget.
# R2: the fast gate must be a STRICT SUBSET of the full gate and <= 60 s median; the full gate <= 300 s.
# Here: full = npm test, which builds first (vite build && node --test over tests/ and test/, .js and
# .mjs) because the browser suites serve dist/; fast = affected suites only (it builds dist itself).
#
# Timeouts are KILL WINDOWS, not budgets; they are generous relative to a measured full run of seconds.
CHECK_CMD='npm test'
CHECK_TIMEOUT=300
CHECK_FAST_CMD='bash tools/fast-gate.sh'
# The declared contract applies only to this repo and its worktrees: fleet-check scopes a
# machine-global conf by owner, and UNSETS the declaration when the owner is missing or foreign —
# an ownerless install silently degrades every run to implied-from-rc, which is exactly how the
# airhorn-3dph drift stayed invisible. The installer refuses a tracked contract that names no owner.
CHECK_FAST_CONTRACT_OWNER="$HOME/airhorn/.git"
# Repo-declared producer verdict: EVERY rc-0 verdict line tools/fast-gate.sh can emit, with its rc
# semantics. (tools/fast-gate.sh's header is the prose form of this; tests/gate-smoke.test.js pins
# the two in step by running the real gate and classifying what it actually prints — airhorn-3dph.)
#   rc 0, >=1 suite ran and passed:
#     fast-gate: PASS (N suite(s), M changed file(s))                                      N >= 1
#   rc 0, NO suite executed — no-work passes (CHECK_FAST_NO_WORK_POLICY=pass), each loud in the log:
#     fast-gate: no changed files
#     fast-gate: ZERO-SUITE PASS (N changed file(s), all M exempt; FAST_GATE_ALLOW_ZERO=1)
#                                                    the explicit suite-free bless — never a bare PASS
#     fast-gate: ZERO-SUITE PASS (N changed file(s): M exempt, K deleted-suite; FAST_GATE_ALLOW_ZERO=1)
#                                                    the same bless when a deleted SUITE is in the set:
#                                                    a deleted suite selects nothing by design (airhorn-o0u),
#                                                    which is not an exemption, so the all-exempt line would lie
#     fast-gate: ZERO-SUITE PASS (N changed file(s), all M pending; FAST_GATE_ALLOW_ZERO=1)
#                                                    every selected suite is '~'-pending, acknowledged
#   rc 1 — every other terminal line: FAIL / unmapped / zero-suite / missing / unmapped-suite /
#   failed: build, AND a non-empty change whose selected suites are ALL '~'-pending (0 executed;
#   airhorn-dn7d). No rc-0 pattern matches any of them; the exit code carries the failure.
CHECK_FAST_PASS_RE='^fast-gate: PASS \([1-9][0-9]* suite\(s\), [1-9][0-9]* changed file\(s\)\)$'
CHECK_FAST_NO_WORK_RE='^fast-gate: (no changed files|ZERO-SUITE PASS \([1-9][0-9]* changed file\(s\), all [1-9][0-9]* (exempt|pending); FAST_GATE_ALLOW_ZERO=1\)|ZERO-SUITE PASS \([1-9][0-9]* changed file\(s\): [0-9]+ exempt, [1-9][0-9]* deleted-suite; FAST_GATE_ALLOW_ZERO=1\))$'
CHECK_FAST_NO_WORK_POLICY=pass
CHECK_FAST_COVERAGE_REQUIRED=1
CHECK_FAST_TIMEOUT=120
